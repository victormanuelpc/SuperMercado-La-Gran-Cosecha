<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Gran Cosecha · Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-hoja: #1F3D2B;
    --verde-tallo: #3D5A3A;
    --oliva: #7C8B4E;
    --oro-maiz: #D3A429;
    --tomate: #C1440E;
    --papel: #F6F3EA;
    --papel-oscuro: #EAE5D6;
    --tinta: #23241F;
    --tinta-suave: #5B5C52;
    --borde: #D8D2BE;
    --blanco: #FFFEFB;
    --radio: 10px;
    --sombra: 0 2px 10px rgba(31,61,43,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--papel); color:var(--tinta);
    font-family:'Space Grotesk', sans-serif; font-size:15px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces', serif; letter-spacing:-0.01em; margin:0;}
  .mono{font-family:'IBM Plex Mono', monospace;}

  /* ---------- layout ---------- */
  #app{display:flex; min-height:100vh;}
  nav.sidebar{
    width:230px; background:var(--verde-hoja); color:var(--papel);
    display:flex; flex-direction:column; flex-shrink:0;
    position:sticky; top:0; height:100vh;
  }
  .brand{padding:22px 20px 14px; border-bottom:1px solid rgba(255,255,255,0.12);}
  .brand .tag{display:inline-block; background:var(--oro-maiz); color:var(--verde-hoja); font-weight:700; font-size:10px; letter-spacing:0.08em; padding:2px 7px; border-radius:4px; margin-bottom:8px;}
  .brand h1{font-size:21px; line-height:1.15; color:var(--papel);}
  .brand .sub{font-size:11.5px; color:var(--oliva); margin-top:4px; font-family:'IBM Plex Mono',monospace;}

  .navlist{list-style:none; margin:0; padding:14px 10px; flex:1; overflow-y:auto;}
  .navlist li{margin-bottom:2px;}
  .navlist button{
    width:100%; text-align:left; background:transparent; border:none; color:rgba(246,243,234,0.75);
    padding:10px 12px; border-radius:8px; cursor:pointer; font-family:inherit; font-size:14px;
    display:flex; align-items:center; gap:10px; transition:background .15s, color .15s;
  }
  .navlist button .dot{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.5; flex-shrink:0;}
  .navlist button:hover{background:rgba(255,255,255,0.06); color:var(--papel);}
  .navlist button.active{background:var(--oro-maiz); color:var(--verde-hoja); font-weight:600;}
  .navlist button.active .dot{background:var(--verde-hoja); opacity:1;}

  .sidebar-foot{padding:14px 20px; font-size:11px; color:var(--oliva); border-top:1px solid rgba(255,255,255,0.1);}
  #sidebar-slogan{
    font-family:'Fraunces', serif; font-style:italic; font-size:12.5px; line-height:1.5;
    color:var(--oro-maiz); border-top:1px solid rgba(255,255,255,0.14); padding:16px 20px;
  }

  main{flex:1; padding:32px 40px; max-width:1180px;}
  .page-head{margin-bottom:24px;}
  .page-head .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--tomate); margin-bottom:6px;}
  .page-head h2{font-size:28px; color:var(--verde-hoja);}
  .page-head p{color:var(--tinta-suave); margin:6px 0 0; font-size:14px; max-width:640px;}

  /* ---------- cards / forms ---------- */
  .card{background:var(--blanco); border:1px solid var(--borde); border-radius:var(--radio); padding:20px 22px; margin-bottom:20px; box-shadow:var(--sombra);}
  .card h3{font-size:15px; color:var(--verde-hoja); margin-bottom:14px; display:flex; align-items:center; gap:8px;}
  .card h3::before{content:''; width:4px; height:16px; background:var(--oro-maiz); border-radius:2px; display:inline-block;}

  .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:12px;}
  label{display:block; font-size:11.5px; color:var(--tinta-suave); margin-bottom:5px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em;}
  input, select{
    width:100%; padding:9px 10px; border:1px solid var(--borde); border-radius:7px;
    font-family:inherit; font-size:14px; background:var(--papel); color:var(--tinta);
  }
  input:focus, select:focus{outline:none; border-color:var(--oro-maiz); background:var(--blanco);}
  .field{margin-bottom:0;}
  .row-actions{margin-top:14px; display:flex; gap:10px; align-items:center;}

  button.btn{
    background:var(--verde-hoja); color:var(--papel); border:none; padding:10px 18px;
    border-radius:7px; font-family:inherit; font-weight:600; font-size:13.5px; cursor:pointer;
    transition:background .15s, transform .1s;
  }
  button.btn:hover{background:var(--verde-tallo);}
  button.btn:active{transform:scale(0.98);}
  button.btn.secondary{background:transparent; color:var(--verde-hoja); border:1px solid var(--verde-hoja);}
  button.btn.tomate{background:var(--tomate);}
  button.btn.tomate:hover{background:#a3390b;}
  button.btn.small{padding:6px 12px; font-size:12.5px;}

  .hint{font-size:12px; color:var(--tinta-suave); margin-top:8px;}
  .badge{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:700; font-family:'IBM Plex Mono',monospace;}
  .badge.pagado{background:#DDEBD4; color:var(--verde-hoja);}
  .badge.pendiente{background:#FBE4D5; color:var(--tomate);}
  .badge.contado{background:#EAE5D6; color:var(--tinta-suave);}

  /* ---------- tables ---------- */
  .table-wrap{overflow-x:auto; border-radius:var(--radio); border:1px solid var(--borde);}
  table{width:100%; border-collapse:collapse; background:var(--blanco); font-size:13.5px;}
  thead th{
    background:var(--papel-oscuro); color:var(--verde-hoja); font-weight:700; text-align:left;
    padding:9px 12px; font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em;
    position:sticky; top:0; border-bottom:1px solid var(--borde); white-space:nowrap;
  }
  tbody td{padding:9px 12px; border-bottom:1px solid #EFEBDC; white-space:nowrap;}
  tbody tr:hover{background:#FBFAF4;}
  tbody tr:last-child td{border-bottom:none;}
  .num{font-family:'IBM Plex Mono', monospace; text-align:right;}
  .empty-row td{color:var(--tinta-suave); text-align:center; padding:22px; font-style:italic;}

  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:22px;}
  .kpi{background:var(--blanco); border:1px solid var(--borde); border-radius:var(--radio); padding:16px 18px; box-shadow:var(--sombra);}
  .kpi .label{font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--tinta-suave); font-weight:600;}
  .kpi .value{font-family:'IBM Plex Mono',monospace; font-size:24px; color:var(--verde-hoja); margin-top:4px; font-weight:600;}
  .kpi.tomate .value{color:var(--tomate);}

  .tabs-inline{display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap;}
  .tabs-inline button{
    background:var(--blanco); border:1px solid var(--borde); color:var(--tinta-suave);
    padding:7px 14px; border-radius:20px; font-family:inherit; font-size:13px; cursor:pointer; font-weight:600;
  }
  .tabs-inline button.active{background:var(--verde-hoja); color:var(--papel); border-color:var(--verde-hoja);}

  .client-card{cursor:pointer;}
  .client-list{display:grid; gap:10px;}
  .client-item{
    background:var(--blanco); border:1px solid var(--borde); border-radius:var(--radio); padding:14px 16px;
    display:flex; justify-content:space-between; align-items:center; cursor:pointer; transition:border-color .15s;
  }
  .client-item:hover{border-color:var(--oro-maiz);}
  .client-item .name{font-weight:700; color:var(--verde-hoja); font-size:15px;}
  .client-item .meta{font-size:12px; color:var(--tinta-suave); margin-top:2px;}
  .client-item .saldo{font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:700;}
  .client-item .saldo.cero{color:var(--verde-hoja);}
  .client-item .saldo.debe{color:var(--tomate);}

  .toast{
    position:fixed; bottom:24px; right:24px; background:var(--verde-hoja); color:var(--papel);
    padding:12px 20px; border-radius:8px; box-shadow:0 4px 18px rgba(0,0,0,0.2); font-size:13.5px;
    opacity:0; transform:translateY(10px); transition:all .25s; z-index:999; max-width:320px;
  }
  .toast.show{opacity:1; transform:translateY(0);}
  .toast.err{background:var(--tomate);}

  .checkbox-row{display:flex; align-items:center; gap:8px; margin-top:4px;}
  .checkbox-row input{width:auto;}
  .checkbox-row label{margin:0; text-transform:none; font-weight:500; font-size:13px;}

  #loading{position:fixed; inset:0; background:var(--papel); display:flex; align-items:center; justify-content:center; z-index:1000; flex-direction:column; gap:10px;}
  #loading .mono{color:var(--tinta-suave); font-size:13px;}
  .back-link{cursor:pointer; color:var(--tinta-suave); font-size:13px; margin-bottom:14px; display:inline-flex; align-items:center; gap:6px;}
  .back-link:hover{color:var(--verde-hoja);}

  @media (max-width:800px){
    #app{flex-direction:column;}
    nav.sidebar{width:100%; height:auto; position:relative;}
    main{padding:20px;}
  }
</style>
</head>
<body>

<div id="loading">
  <div style="font-family:'Fraunces',serif; font-size:20px; color:var(--verde-hoja);">La Gran Cosecha</div>
  <div class="mono">Cargando datos…</div>
</div>

<div id="app" style="display:none;">
  <nav class="sidebar">
    <div class="brand">
      <div style="background:var(--blanco); border-radius:10px; padding:8px; margin-bottom:10px;">
        <img src="logo-gran-cosecha.jpg" alt="La Gran Cosecha" style="width:100%; display:block; border-radius:6px;">
      </div>
      <div class="sub">gestión &amp; caja</div>
    </div>
    <ul class="navlist" id="navlist"></ul>
    <div class="sidebar-foot" id="sidebar-slogan">Sembrando confianza y cosechando bienestar.</div>
  </nav>
  <main id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ======================= CONFIG ======================= */
const CONFIG = {
  // Pega aquí la URL de tu implementación de Apps Script (Ver instrucciones en SETUP.md)
  API_URL: 'https://script.google.com/macros/s/AKfycbypg2kPPMQV1DSI0x2_bOolN123YVGHxdueuxTFaRA4Xk1MdTJYBj5JFm7kwqbyRS7AXg/exec'
};

const UNIDADES = ['Libra','Kilogramo','Caja','Bulto','Docena','Canastilla','Unidad'];
const ARTICULOS = [
  'Tomate de Mesa','Pimentón','Ajo Pelado','Cebolla Blanca','Cebollín','Papa Amarilla','Zanahoria',
  'Habichuela','Frijol','Arveja','Papa Pastusa','Plátano Verde','Plátano Maduro','Naranja Criolla',
  'Limón Criollo','Lulo','Tomate de Árbol','Guayaba','Mora','Chocheco','Piña Oromiel','Lechoza','Melón',
  'Cilantro','Lechuga Batavia','Lechuga Crespa','Arracacha','Apio España','Pepino Cohombro','Repollo',
  'Coliflor','Brócoli','Manzana Verde','Manzana Roja','Uvas','Bananos','Peras','Aguacate','Papa Única','Yuca',
  'Otro (escribir manualmente)'
];

let STATE = {
  capital: [], compras: [], calidad: [], ventas: [], clientes: [], fiado: [], abonos: [], caja: [], preciosDia: []
};
let currentSection = 'dashboard';
let currentClientId = null;

/* ======================= API ======================= */
async function apiGet(){
  const res = await fetch(CONFIG.API_URL + '?action=getAll');
  return res.json();
}
async function apiPost(action, data){
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action, data})
  });
  return res.json();
}

async function loadAll(){
  try{
    const data = await apiGet();
    if(data.ok){
      STATE = data;
    } else {
      showToast('Error cargando datos: ' + data.error, true);
    }
  }catch(err){
    showToast('No se pudo conectar con el backend. Revisa CONFIG.API_URL.', true);
  }
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  renderNav();
  renderSection();
}

/* ======================= NAV ======================= */
const SECTIONS = [
  {id:'dashboard', label:'Resumen'},
  {id:'capital', label:'Capital social'},
  {id:'compras', label:'Compras'},
  {id:'calidad', label:'Control de calidad'},
  {id:'clientes', label:'Clientes'},
  {id:'ventas', label:'Ventas'},
  {id:'historial-compras', label:'Historial · compras'},
  {id:'historial-venta-real', label:'Historial · venta real'},
  {id:'historial-venta-cliente', label:'Historial · venta por cliente'},
  {id:'caja', label:'Flujo de caja'},
];

function renderNav(){
  const nav = document.getElementById('navlist');
  nav.innerHTML = SECTIONS.map(s => `
    <li><button class="${s.id===currentSection?'active':''}" onclick="goTo('${s.id}')">
      <span class="dot"></span>${s.label}
    </button></li>
  `).join('');
}
function goTo(id){
  currentSection = id;
  currentClientId = null;
  renderNav();
  renderSection();
}

/* ======================= HELPERS ======================= */
function fmtMoney(n){
  n = Number(n)||0;
  return '$ ' + n.toLocaleString('es-CO', {maximumFractionDigits:0});
}
function fmtNum(n, dec=2){
  n = Number(n)||0;
  return n.toLocaleString('es-CO', {maximumFractionDigits:dec});
}
function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function monthKey(dateStr){
  return (dateStr||'').slice(0,7); // yyyy-mm
}
function showToast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr?' err':'');
  setTimeout(()=> t.className = 'toast', 3200);
}
function el(html){
  const div = document.createElement('div');
  div.innerHTML = html.trim();
  return div.firstChild;
}

function selectArticuloHTML(id){
  return `<select id="${id}">${ARTICULOS.map(a=>`<option>${a}</option>`).join('')}</select>
    <input type="text" id="${id}-otro" placeholder="Escribe el nombre del artículo" style="display:none; margin-top:6px;">`;
}
function wireArticuloOtro(id){
  const sel = document.getElementById(id);
  const otro = document.getElementById(id + '-otro');
  sel.addEventListener('change', () => {
    otro.style.display = sel.value === 'Otro (escribir manualmente)' ? 'block' : 'none';
  });
}
function getArticuloValue(id){
  const sel = document.getElementById(id);
  if(sel.value === 'Otro (escribir manualmente)'){
    return document.getElementById(id + '-otro').value.trim();
  }
  return sel.value;
}

/* ======================= RENDER ROUTER ======================= */
function renderSection(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  switch(currentSection){
    case 'dashboard': return renderDashboard(main);
    case 'capital': return renderCapital(main);
    case 'compras': return renderCompras(main);
    case 'calidad': return renderCalidad(main);
    case 'ventas': return renderVentas(main);
    case 'clientes': return renderClientes(main);
    case 'historial-compras': return renderHistCompras(main);
    case 'historial-venta-real': return renderHistVentaReal(main);
    case 'historial-venta-cliente': return renderHistVentaCliente(main);
    case 'caja': return renderCaja(main);
  }
}

function pageHead(eyebrow, title, desc){
  return `<div class="page-head">
    <div class="eyebrow">${eyebrow}</div>
    <h2>${title}</h2>
    ${desc?`<p>${desc}</p>`:''}
  </div>`;
}

/* ======================= DASHBOARD ======================= */
function renderDashboard(main){
  const totalCapital = STATE.capital.reduce((s,c)=> s + (c.Tipo==='Retiro'? -Number(c.Monto): Number(c.Monto)), 0);
  const totalCompras = STATE.compras.reduce((s,c)=> s + Number(c.ValorTotal||0), 0);
  const totalVentas = STATE.ventas.reduce((s,v)=> s + Number(v.ValorTotal||0), 0);
  const totalCaja = STATE.caja.reduce((s,c)=> s + Number(c.Ingreso||0) - Number(c.Egreso||0), 0);
  const deudaClientes = STATE.fiado.reduce((s,f)=> s + Number(f.Saldo||0), 0);

  main.appendChild(el(pageHead('Panorama general','Resumen del negocio','Vista rápida del capital, compras, ventas y cartera de clientes.')));

  main.appendChild(el(`
    <div class="kpi-row">
      <div class="kpi"><div class="label">Capital social</div><div class="value">${fmtMoney(totalCapital)}</div></div>
      <div class="kpi"><div class="label">Total comprado</div><div class="value">${fmtMoney(totalCompras)}</div></div>
      <div class="kpi"><div class="label">Total vendido</div><div class="value">${fmtMoney(totalVentas)}</div></div>
      <div class="kpi tomate"><div class="label">Cartera por cobrar</div><div class="value">${fmtMoney(deudaClientes)}</div></div>
      <div class="kpi"><div class="label">Caja (ingresos - egresos op.)</div><div class="value">${fmtMoney(totalCaja)}</div></div>
    </div>
  `));

  main.appendChild(el(`<div class="card"><h3>Últimas compras</h3>
    <div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Artículo</th><th>Cant.</th><th>Unidad</th><th class="num">Valor total</th></tr></thead>
    <tbody>${STATE.compras.slice(-5).reverse().map(c=>`<tr><td>${c.Fecha}</td><td>${c.Articulo}</td><td>${fmtNum(c.Cantidad)}</td><td>${c.Unidad}</td><td class="num">${fmtMoney(c.ValorTotal)}</td></tr>`).join('') || '<tr class="empty-row"><td colspan="5">Aún no hay compras registradas.</td></tr>'}</tbody></table></div>
  </div>`));

  main.appendChild(el(`<div class="card"><h3>Últimas ventas</h3>
    <div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Artículo</th><th>Cant.</th><th>Unidad</th><th class="num">Valor total</th><th>Tipo</th></tr></thead>
    <tbody>${STATE.ventas.slice(-5).reverse().map(v=>`<tr><td>${v.Fecha}</td><td>${v.Articulo}</td><td>${fmtNum(v.Cantidad)}</td><td>${v.Unidad}</td><td class="num">${fmtMoney(v.ValorTotal)}</td><td><span class="badge ${v.TipoPago==='Fiado'?'pendiente':'contado'}">${v.TipoPago||'Contado'}</span></td></tr>`).join('') || '<tr class="empty-row"><td colspan="6">Aún no hay ventas registradas.</td></tr>'}</tbody></table></div>
  </div>`));
}

/* ======================= CAPITAL SOCIAL ======================= */
function renderCapital(main){
  main.appendChild(el(pageHead('Inversión inicial','Capital social','Registra los aportes (o retiros) de capital con los que opera el negocio.')));

  const card = el(`<div class="card"><h3>Nuevo movimiento de capital</h3>
    <div class="grid">
      <div class="field"><label>Fecha</label><input type="date" id="cap-fecha" value="${todayStr()}"></div>
      <div class="field"><label>Concepto</label><input type="text" id="cap-concepto" placeholder="Ej. Aporte inicial socios"></div>
      <div class="field"><label>Tipo</label><select id="cap-tipo"><option value="Aporte">Aporte</option><option value="Retiro">Retiro</option></select></div>
      <div class="field"><label>Monto</label><input type="number" id="cap-monto" placeholder="0"></div>
    </div>
    <div class="row-actions"><button class="btn" id="cap-guardar">Guardar movimiento</button></div>
  </div>`);
  main.appendChild(card);

  const total = STATE.capital.reduce((s,c)=> s + (c.Tipo==='Retiro'? -Number(c.Monto): Number(c.Monto)), 0);
  main.appendChild(el(`<div class="kpi-row"><div class="kpi"><div class="label">Capital social acumulado</div><div class="value">${fmtMoney(total)}</div></div></div>`));

  main.appendChild(el(`<div class="card"><h3>Movimientos</h3>
    <div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Tipo</th><th class="num">Monto</th></tr></thead>
    <tbody>${STATE.capital.slice().reverse().map(c=>`<tr><td>${c.Fecha}</td><td>${c.Concepto}</td><td>${c.Tipo}</td><td class="num">${fmtMoney(c.Monto)}</td></tr>`).join('') || '<tr class="empty-row"><td colspan="4">Sin movimientos aún.</td></tr>'}</tbody></table></div>
  </div>`));

  document.getElementById('cap-guardar').onclick = async () => {
    const data = {
      fecha: document.getElementById('cap-fecha').value,
      concepto: document.getElementById('cap-concepto').value,
      tipo: document.getElementById('cap-tipo').value,
      monto: document.getElementById('cap-monto').value
    };
    if(!data.concepto || !data.monto) return showToast('Completa concepto y monto', true);
    const r = await apiPost('addCapital', data);
    if(r.ok){ STATE.capital.push(r.item); showToast('Movimiento guardado'); renderCapital(main); main.innerHTML=''; renderSection(); }
    else showToast(r.error, true);
  };
}

/* ======================= COMPRAS ======================= */
function renderCompras(main){
  main.appendChild(el(pageHead('Abastos','Compras','Registra cada compra realizada en la central de abastos.')));

  const card = el(`<div class="card"><h3>Nueva compra</h3>
    <div class="grid">
      <div class="field"><label>Fecha</label><input type="date" id="com-fecha" value="${todayStr()}"></div>
      <div class="field"><label>Artículo</label>${selectArticuloHTML('com-articulo')}</div>
      <div class="field"><label>Unidad de medida</label><select id="com-unidad">${UNIDADES.map(u=>`<option>${u}</option>`).join('')}</select></div>
      <div class="field"><label>Cantidad</label><input type="number" id="com-cantidad" placeholder="0"></div>
      <div class="field"><label>Valor unitario</label><input type="number" id="com-valorunit" placeholder="0"></div>
    </div>
    <div class="hint" id="com-total-preview">Valor total: $ 0</div>

function renderCalidad(main){
  main.appendChild(el(pageHead('Revisión en casa','Control de calidad','Después de comprar, descuenta la cantidad no idónea para recalcular el precio real por unidad.')));

  const comprasSinControl = STATE.compras.filter(c => !STATE.calidad.some(k => k.IDCompra === c.ID));

  const card = el(`<div class="card"><h3>Registrar control de calidad</h3>
    <div class="grid">
      <div class="field" style="grid-column:span 2;"><label>Compra</label>
        <select id="cal-compra">
          <option value="">Selecciona una compra…</option>
          ${comprasSinControl.map(c=>`<option value="${c.ID}">${c.Fecha} · ${c.Articulo} · ${fmtNum(c.Cantidad)} ${c.Unidad} · ${fmtMoney(c.ValorTotal)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Cantidad real / idónea</label><input type="number" id="cal-cantreal" placeholder="0"></div>
      <div class="field"><label>Observación</label><input type="text" id="cal-obs" placeholder="Ej. 2 libras dañadas"></div>
    </div>
    <div class="hint" id="cal-preview"></div>
    <div class="row-actions"><button class="btn" id="cal-guardar">Guardar control</button></div>
  </div>`);
  main.appendChild(card);

  main.appendChild(el(`<div class="card"><h3>Historial de control de calidad</h3>
    <div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Artículo</th><th class="num">Cant. comprada</th><th class="num">Cant. real</th><th>Unidad</th><th class="num">V. unitario real</th><th>Observación</th></tr></thead>
    <tbody>${STATE.calidad.slice().reverse().map(k=>`<tr><td>${k.Fecha}</td><td>${k.Articulo}</td><td class="num">${fmtNum(k.CantidadComprada)}</td><td class="num">${fmtNum(k.CantidadReal)}</td><td>${k.Unidad}</td><td class="num">${fmtMoney(k.ValorUnitarioReal)}</td><td>${k.Observacion||''}</td></tr>`).join('') || '<tr class="empty-row"><td colspan="7">Sin controles registrados.</td></tr>'}</tbody></table></div>
  </div>`));

  const updatePreview = () => {
    const compraId = document.getElementById('cal-compra').value;
    const compra = STATE.compras.find(c => c.ID === compraId);
    const cantReal = Number(document.getElementById('cal-cantreal').value)||0;
    if(compra && cantReal>0){
      const vuReal = Number(compra.ValorTotal)/cantReal;
      document.getElementById('cal-preview').textContent = `Precio real recalculado: ${fmtMoney(compra.ValorTotal)} ÷ ${fmtNum(cantReal)} ${compra.Unidad} = ${fmtMoney(vuReal)} por ${compra.Unidad.toLowerCase()}`;
    } else {
      document.getElementById('cal-preview').textContent = '';
    }
  };
  document.getElementById('cal-compra').onchange = updatePreview;
  document.getElementById('cal-cantreal').oninput = updatePreview;

  document.getElementById('cal-guardar').onclick = async () => {
    const compraId = document.getElementById('cal-compra').value;
    const compra = STATE.compras.find(c => c.ID === compraId);
    if(!compra) return showToast('Selecciona la compra a controlar', true);
    const cantReal = document.getElementById('cal-cantreal').value;
    if(!cantReal) return showToast('Ingresa la cantidad real', true);
    const data = {
      idCompra: compra.ID,
      fecha: todayStr(),
      articulo: compra.Articulo,
      cantidadComprada: compra.Cantidad,
      cantidadReal: cantReal,
      unidad: compra.Unidad,
      valorTotalCompra: compra.ValorTotal,
      observacion: document.getElementById('cal-obs').value
    };
    const r = await apiPost('addControlCalidad', data);
    if(r.ok){ STATE.calidad.push(r.item); showToast('Control de calidad guardado'); renderSection(); }
    else showToast(r.error, true);
  };
}

    const articulo = getArticuloValue('ven-articulo').trim().toLowerCase();

    return STATE.preciosDia.find(p => p.Fecha === fecha && String(p.Articulo).trim().toLowerCase() === articulo) || null;

  function autocompletarPrecio(){

  document.getElementById('ven-totalcerrado').oninput = updatePreview;

    if(tipoPago==='Fiado' && !idCliente) return showToast('Selecciona el cliente para la venta a crédito', true);

    const data = {
      fecha: document.getElementById('ven-fecha').value,
      articulo: getArticuloValue('ven-articulo'),
      unidad: document.getElementById('ven-unidad').value,
      cantidad: document.getElementById('ven-cantidad').value,
      valorUnitarioCalculado: document.getElementById('ven-valorunit').value || 0,
      esPrecioCerrado: esCerrado,
      valorTotalCerrado: document.getElementById('ven-totalcerrado').value || 0,
      tipoPago: tipoPago,
      idCliente: idCliente
    };

    const r = await apiPost('addVenta', data);
    if(r.ok){ STATE.ventas.push(r.item); showToast('Venta guardada'); await loadAll(); goTo('ventas'); }
    else showToast(r.error, true);
  };

  document.getElementById('pre-guardar').onclick = async () => {
    const data = {
      fecha: document.getElementById('pre-fecha').value,
      articulo: getArticuloValue('pre-articulo'),
      precioUnitario: document.getElementById('pre-precio').value
    };
    if(!data.articulo || !data.precioUnitario) return showToast('Completa artículo y precio', true);
    const r = await apiPost('setPrecioDia', data);
    if(r.ok){
      const existente = STATE.preciosDia.find(p => p.Fecha === data.fecha && String(p.Articulo).trim().toLowerCase() === data.articulo.trim().toLowerCase());
      if(existente){ existente.PrecioUnitario = Number(data.precioUnitario); }
      else { STATE.preciosDia.push(r.item); }
      showToast(r.updated ? 'Precio del día actualizado' : 'Precio del día fijado');
      renderSection();
    } else showToast(r.error, true);
  };
}

/* ======================= HISTORIAL: COMPRAS POR ARTÍCULO ======================= */
function renderHistCompras(main){
  main.appendChild(el(pageHead('Historial 1','Compras por artículo','Cantidad y dinero invertido por artículo, mes a mes.')));

  const porArticulo = {};
  STATE.compras.forEach(c => {
    const key = c.Articulo + '|' + monthKey(c.Fecha);
    if(!porArticulo[key]) porArticulo[key] = {articulo:c.Articulo, mes:monthKey(c.Fecha), cantidad:0, unidad:c.Unidad, total:0};
    porArticulo[key].cantidad += Number(c.Cantidad);
    porArticulo[key].total += Number(c.ValorTotal);
  });
  const rows = Object.values(porArticulo).sort((a,b)=> b.mes.localeCompare(a.mes) || a.articulo.localeCompare(b.articulo));

  main.appendChild(el(`<div class="card"><h3>Resumen mensual por artículo</h3>
    <div class="table-wrap"><table><thead><tr><th>Mes</th><th>Artículo</th><th class="num">Cantidad</th><th>Unidad</th><th class="num">Total comprado</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td class="mono">${r.mes}</td><td>${r.articulo}</td><td class="num">${fmtNum(r.cantidad)}</td><td>${r.unidad}</td><td class="num">${fmtMoney(r.total)}</td></tr>`).join('') || '<tr class="empty-row"><td colspan="5">Sin datos aún.</td></tr>'}</tbody></table></div>
  </div>`));
}

/* ======================= HISTORIAL: VENTA REAL / EFECTIVA ======================= */
function renderHistVentaReal(main){
  main.appendChild(el(pageHead('Historial 2','Venta real (con control de calidad)','Producto realmente vendido por mes, considerando el descuento por pérdida en control de calidad.')));

  const porArticulo = {};
  STATE.ventas.forEach(v => {
    const key = v.Articulo + '|' + monthKey(v.Fecha);
    if(!porArticulo[key]) porArticulo[key] = {articulo:v.Articulo, mes:monthKey(v.Fecha), cantidad:0, unidad:v.Unidad, total:0};
    porArticulo[key].cantidad += Number(v.Cantidad);
    porArticulo[key].total += Number(v.ValorTotal);
  });
  const rows = Object.values(porArticulo).sort((a,b)=> b.mes.localeCompare(a.mes) || a.articulo.localeCompare(b.articulo));

  main.appendChild(el(`<div class="card"><h3>Venta real mensual por artículo</h3>
    <div class="table-wrap"><table><thead><tr><th>Mes</th><th>Artículo</th><th class="num">Cant. vendida</th><th>Unidad</th><th class="num">Precio real prom.</th><th class="num">Total vendido</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td class="mono">${r.mes}</td><td>${r.articulo}</td><td class="num">${fmtNum(r.cantidad)}</td><td>${r.unidad}</td><td class="num">${fmtMoney(r.cantidad>0?r.total/r.cantidad:0)}</td><td class="num">${fmtMoney(r.total)}</td></tr>`).join('') || '<tr class="empty-row"><td colspan="6">Sin datos aún.</td></tr>'}</tbody></table></div>
  </div>`));

  main.appendChild(el(`<div class="card"><h3>Pérdida detectada por control de calidad (referencia)</h3>
    <div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Artículo</th><th class="num">Comprado</th><th class="num">Real (idóneo)</th><th class="num">Merma</th><th>Unidad</th></tr></thead>
    <tbody>${STATE.calidad.slice().reverse().map(k=>`<tr><td>${k.Fecha}</td><td>${k.Articulo}</td><td class="num">${fmtNum(k.CantidadComprada)}</td><td class="num">${fmtNum(k.CantidadReal)}</td><td class="num">${fmtNum(k.CantidadComprada-k.CantidadReal)}</td><td>${k.Unidad}</td></tr>`).join('') || '<tr class="empty-row"><td colspan="6">Sin controles aún.</td></tr>'}</tbody></table></div>
  </div>`));
}

/* ======================= HISTORIAL: VENTA POR CLIENTE ======================= */
function renderHistVentaCliente(main){
  main.appendChild(el(pageHead('Historial 3','Venta por cliente','Revisa qué compró cada cliente. Activa las casillas según qué tanto detalle quieras ver.')));

  const optsCard = el(`<div class="card"><h3>Opciones de visualización</h3>
    <div class="checkbox-row"><input type="checkbox" id="hist-ver-articulos" checked><label for="hist-ver-articulos">Ver artículos y cantidad comprada</label></div>
    <div class="checkbox-row"><input type="checkbox" id="hist-ver-total" checked><label for="hist-ver-total">Ver solo nombre y total en dinero</label></div>
  </div>`);
  main.appendChild(optsCard);

  const tablesContainer = el('<div id="hist-cliente-tables"></div>');
  main.appendChild(tablesContainer);

  function renderTables(){
    const verArticulos = document.getElementById('hist-ver-articulos').checked;
    const verTotal = document.getElementById('hist-ver-total').checked;
    tablesContainer.innerHTML = '';
    const ventasConCliente = STATE.ventas.filter(v => v.IDCliente);

    if(verTotal){
      const porCliente = {};
      ventasConCliente.forEach(v => {
        const cli = STATE.clientes.find(c => c.ID === v.IDCliente);
        const nombre = cli ? cli.Nombre : 'Desconocido';
        const key = nombre + '|' + monthKey(v.Fecha);
        if(!porCliente[key]) porCliente[key] = {cliente:nombre, mes:monthKey(v.Fecha), total:0, compras:0};
        porCliente[key].total += Number(v.ValorTotal);
        porCliente[key].compras += 1;
      });
      const rows = Object.values(porCliente).sort((a,b)=> b.mes.localeCompare(a.mes) || a.cliente.localeCompare(b.cliente));
      tablesContainer.appendChild(el(`<div class="card"><h3>Nombre y total en dinero</h3>
        <div class="table-wrap"><table><thead><tr><th>Mes</th><th>Cliente</th><th class="num">N.° de compras</th><th class="num">Total comprado</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td class="mono">${r.mes}</td><td>${r.cliente}</td><td class="num">${r.compras}</td><td class="num">${fmtMoney(r.total)}</td></tr>`).join('') || '<tr class="empty-row"><td colspan="4">Sin datos aún.</td></tr>'}</tbody></table></div>
      </div>`));
    }

    if(verArticulos){
      const porClienteArt = {};
      ventasConCliente.forEach(v => {
        const cli = STATE.clientes.find(c => c.ID === v.IDCliente);
        const nombre = cli ? cli.Nombre : 'Desconocido';
        const key = nombre + '|' + monthKey(v.Fecha) + '|' + v.Articulo;
        if(!porClienteArt[key]) porClienteArt[key] = {cliente:nombre, mes:monthKey(v.Fecha), articulo:v.Articulo, cantidad:0, unidad:v.Unidad, total:0};
        porClienteArt[key].cantidad += Number(v.Cantidad);
        porClienteArt[key].total += Number(v.ValorTotal);
      });
      const rows2 = Object.values(porClienteArt).sort((a,b)=> b.mes.localeCompare(a.mes) || a.cliente.localeCompare(b.cliente) || a.articulo.localeCompare(b.articulo));
      tablesContainer.appendChild(el(`<div class="card"><h3>Artículos y cantidad comprada</h3>
        <div class="table-wrap"><table><thead><tr><th>Mes</th><th>Cliente</th><th>Artículo</th><th class="num">Cantidad</th><th>Unidad</th><th class="num">Valor</th></tr></thead>
        <tbody>${rows2.map(r=>`<tr><td class="mono">${r.mes}</td><td>${r.cliente}</td><td>${r.articulo}</td><td class="num">${fmtNum(r.cantidad)}</td><td>${r.unidad}</td><td class="num">${fmtMoney(r.total)}</td></tr>`).join('') || '<tr class="empty-row"><td colspan="6">Sin datos aún.</td></tr>'}</tbody></table></div>
      </div>`));
    }

    if(!verTotal && !verArticulos){
      tablesContainer.appendChild(el('<div class="hint">Activa al menos una casilla para ver el historial.</div>'));
    }
  }

  document.getElementById('hist-ver-articulos').onchange = renderTables;
  document.getElementById('hist-ver-total').onchange = renderTables;
  renderTables();
}

/* ======================= FLUJO DE CAJA ======================= */
function renderCaja(main){
  main.appendChild(el(pageHead('Costos operativos','Flujo de caja','Registra transporte, bolsas, servicios de terceros y demás movimientos de caja.')));

  const card = el(`<div class="card"><h3>Nuevo movimiento de caja</h3>
    <div class="grid">
      <div class="field"><label>Fecha</label><input type="date" id="caj-fecha" value="${todayStr()}"></div>
      <div class="field"><label>Tipo de flujo</label><select id="caj-tipo"><option value="Operacional">Operacional</option><option value="Inversion">Inversión</option><option value="Financiacion">Financiación</option></select></div>
      <div class="field"><label>Categoría</label><select id="caj-categoria"><option>Transporte</option><option>Bolsas</option><option>Servicios (ayudante)</option><option>Otro</option></select></div>
      <div class="field"><label>Concepto</label><input type="text" id="caj-concepto" placeholder="Detalle"></div>
      <div class="field"><label>Ingreso</label><input type="number" id="caj-ingreso" placeholder="0"></div>
      <div class="field"><label>Egreso</label><input type="number" id="caj-egreso" placeholder="0"></div>
    </div>
    <div class="row-actions"><button class="btn" id="caj-guardar">Guardar movimiento</button></div>
  </div>`);
  main.appendChild(card);

  const porTipo = {Operacional:0, Inversion:0, Financiacion:0};
  STATE.caja.forEach(c => { porTipo[c.Tipo] = (porTipo[c.Tipo]||0) + Number(c.Ingreso||0) - Number(c.Egreso||0); });

  main.appendChild(el(`<div class="kpi-row">
    <div class="kpi"><div class="label">Flujo operacional</div><div class="value">${fmtMoney(porTipo.Operacional)}</div></div>
    <div class="kpi"><div class="label">Flujo de inversión</div><div class="value">${fmtMoney(porTipo.Inversion)}</div></div>
    <div class="kpi"><div class="label">Flujo de financiación</div><div class="value">${fmtMoney(porTipo.Financiacion)}</div></div>
  </div>`));

  main.appendChild(el(`<div class="card"><h3>Movimientos de caja</h3>
    <div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Concepto</th><th class="num">Ingreso</th><th class="num">Egreso</th></tr></thead>
    <tbody>${STATE.caja.slice().reverse().map(c=>`<tr><td>${c.Fecha}</td><td>${c.Tipo}</td><td>${c.Categoria}</td><td>${c.Concepto}</td><td class="num">${fmtMoney(c.Ingreso)}</td><td class="num">${fmtMoney(c.Egreso)}</td></tr>`).join('') || '<tr class="empty-row"><td colspan="6">Sin movimientos aún.</td></tr>'}</tbody></table></div>
  </div>`));

  document.getElementById('caj-guardar').onclick = async () => {
    const data = {
      fecha: document.getElementById('caj-fecha').value,
      tipo: document.getElementById('caj-tipo').value,
      categoria: document.getElementById('caj-categoria').value,
      concepto: document.getElementById('caj-concepto').value,
      ingreso: document.getElementById('caj-ingreso').value || 0,
      egreso: document.getElementById('caj-egreso').value || 0
    };
    const r = await apiPost('addCaja', data);
    if(r.ok){ STATE.caja.push(r.item); showToast('Movimiento de caja guardado'); renderSection(); }
    else showToast(r.error, true);
  };
}

/* ======================= INIT ======================= */
loadAll();
</script>
